<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Analyzer</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2d;
      --panel-2: #15213a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #25324d;
      --accent: #60a5fa;
      --ok: #34d399;
      --warn: #f59e0b;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      width: calc(100vw - 12px);
      margin: 0;
      padding: 8px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
    }
    .sub {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
    }
    .row { margin-bottom: 10px; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .retirement-pair {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      align-items: end;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 8px 9px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0c1528;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    input[readonly] {
      background: #0a1324;
      color: #bfdbfe;
      border-color: #2d4d7e;
      font-weight: 700;
    }
    .input-wrap { position: relative; }
    .input-wrap.with-suffix input { padding-right: 24px; }
    .input-wrap.with-prefix input { padding-left: 20px; }
    .input-prefix {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }
    .input-suffix {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }
    .btn {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #2d4d7e;
      border-radius: 8px;
      background: #19345f;
      color: #dbeafe;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #1d3e72; }
    .note {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .card .k {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .card .v {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .status-ok { color: var(--ok) !important; }
    .status-warn { color: var(--warn) !important; }
    .status-bad { color: var(--bad) !important; }
    .chart-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .table-box {
      overflow: auto;
      max-height: 520px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid #1a2743;
      padding: 7px 8px;
      text-align: right;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--panel-2);
      color: #bfdbfe;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td:first-child, th:first-child,
    td:nth-child(2), th:nth-child(2) {
      text-align: left;
    }
    @media (max-width: 1200px) {
      .grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      .panel { padding: 12px; }
      .chart-box { padding: 10px; }
    }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
      .sub { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const DEFAULTS_STORAGE_KEY = "dennis-bussio-defaults-v1";
    const PROFILE_RATES = {
      conservative: 0.025,
      balanced: 0.05,
      growth: 0.08,
      hyperGrowth: 0.10
    };
    const RMD_START_AGE = 75;
    const SS_COLA_RATE = 0.02;
    const RMD_TABLE = {
      75: 24.6, 76: 23.7, 77: 22.9, 78: 22.0, 79: 21.1, 80: 20.2,
      81: 19.4, 82: 18.5, 83: 17.7, 84: 16.8, 85: 16.0, 86: 15.2,
      87: 14.4, 88: 13.7, 89: 12.9, 90: 12.2, 91: 11.5, 92: 10.8,
      93: 10.1, 94: 9.5, 95: 8.9, 96: 8.4, 97: 7.8, 98: 7.3,
      99: 6.8, 100: 6.4
    };

    const DEFAULT_INPUTS = {
      currentYear: 2026,
      lifeExpectancy: 100,
      yearsToProject: 19,
      inflationRate: 0.03,
      moneyMarketGrowthRate: 0.02,
      houseGrowthRate: 0.03,
      currentAge: 82,
      annualSpendDennis: 65000,
      annualSupportMarc: 15000,
      socialSecurityAnnual: 42000,
      annualPension: 45000,
      checkingBalance: 0,
      savingsBalance: 0,
      retirement1Balance: 150000,
      retirement2Balance: 150000,
      moneyMarketBalance: 0,
      houseAssetValue: 1200000,
      retirement1Profile: "balanced",
      retirement2Profile: "balanced"
    };

    const INPUT_KEYS = Object.keys(DEFAULT_INPUTS);
    const PERCENT_KEYS = new Set(["inflationRate", "moneyMarketGrowthRate", "houseGrowthRate"]);
    const CURRENCY_KEYS = new Set([
      "annualSpendDennis",
      "annualSupportMarc",
      "socialSecurityAnnual",
      "annualPension",
      "checkingBalance",
      "savingsBalance",
      "retirement1Balance",
      "retirement2Balance",
      "moneyMarketBalance",
      "houseAssetValue"
    ]);
    const PROFILE_KEYS = new Set(["retirement1Profile", "retirement2Profile"]);
    const DEFAULT_BUDGET_CATEGORIES = [
      "Gas",
      "Water",
      "HOA",
      "Medical",
      "Car Payment"
    ];

    function num(v, fallback = 0) {
      const normalized = typeof v === "string" ? v.replace(/,/g, "").trim() : v;
      const n = Number(normalized);
      return Number.isFinite(n) ? n : fallback;
    }
    function formatWithCommas(rawValue) {
      const s = String(rawValue ?? "").replace(/,/g, "");
      if (!s) return "";
      if (!/^\d*\.?\d*$/.test(s)) return String(rawValue ?? "");
      const hasDot = s.includes(".");
      const [intPartRaw, decPartRaw = ""] = s.split(".");
      const intPart = intPartRaw ? intPartRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "0";
      if (hasDot) return `${intPart}.${decPartRaw}`;
      return intPart;
    }
    function normalizeCurrencyInput(inputValue) {
      const clean = String(inputValue ?? "").replace(/[^0-9.]/g, "");
      const firstDot = clean.indexOf(".");
      if (firstDot === -1) return formatWithCommas(clean);
      const intPart = clean.slice(0, firstDot);
      const decPart = clean.slice(firstDot + 1).replace(/\./g, "");
      return `${formatWithCommas(intPart || "0")}.${decPart}`;
    }
    function fmtMoney(n, compact = false) {
      if (compact) {
        if (Math.abs(n) >= 1e9) return `$${(n / 1e9).toFixed(2)}B`;
        if (Math.abs(n) >= 1e6) return `$${(n / 1e6).toFixed(2)}M`;
        if (Math.abs(n) >= 1e3) return `$${(n / 1e3).toFixed(0)}K`;
      }
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0
      }).format(n || 0);
    }
    function fmtDate(d) {
      return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }
    function buildMixedYAxisTicks(maxValue) {
      const threshold = 400000;
      const lowStep = 100000;
      const highStep = 100000;
      const safeMax = Math.max(0, maxValue || 0);
      if (safeMax <= threshold) {
        const top = Math.max(lowStep, Math.ceil(safeMax / lowStep) * lowStep);
        return Array.from({ length: Math.floor(top / lowStep) + 1 }, (_, i) => i * lowStep);
      }
      const top = Math.ceil(safeMax / highStep) * highStep;
      const ticks = [];
      for (let v = 0; v <= threshold; v += lowStep) ticks.push(v);
      for (let v = threshold + highStep; v <= top; v += highStep) ticks.push(v);
      return ticks;
    }
    function createDefaultBudgetPlanner() {
      return {
        categories: DEFAULT_BUDGET_CATEGORIES.map((name) => ({ name, amount: 0 }))
      };
    }
    function normalizeBudgetPlannerData(raw) {
      const fallback = createDefaultBudgetPlanner();
      if (!raw || typeof raw !== "object" || !Array.isArray(raw.categories)) return fallback;
      const categories = raw.categories
        .map((cat) => {
          if (!cat || typeof cat !== "object") return null;
          const name = String(cat.name ?? "").trim();
          if (!name) return null;
          return { name, amount: Math.max(0, num(cat.amount, 0)) };
        })
        .filter(Boolean);
      return categories.length > 0 ? { categories } : fallback;
    }
    function getBudgetPlannerFromDefaultsPayload(payload) {
      if (!payload || typeof payload !== "object" || !payload.budgetPlanner) return null;
      return normalizeBudgetPlannerData(payload.budgetPlanner);
    }
    function toDraftValues(values) {
      const draft = {};
      for (const key of INPUT_KEYS) {
        if (PERCENT_KEYS.has(key)) {
          draft[key] = (values[key] * 100).toFixed(2);
        } else if (CURRENCY_KEYS.has(key)) {
          draft[key] = formatWithCommas(values[key]);
        } else {
          draft[key] = String(values[key]);
        }
      }
      return draft;
    }
    function toAppliedValues(draft, currentApplied) {
      const parsed = {};
      for (const key of INPUT_KEYS) {
        if (PERCENT_KEYS.has(key)) {
          const pct = num(String(draft[key]).replace("%", ""), currentApplied[key] * 100);
          parsed[key] = pct / 100;
        } else if (PROFILE_KEYS.has(key)) {
          const value = String(draft[key] || currentApplied[key]);
          parsed[key] = PROFILE_RATES[value] != null ? value : currentApplied[key];
        } else {
          parsed[key] = num(draft[key], currentApplied[key]);
        }
      }
      parsed.currentYear = Math.round(parsed.currentYear);
      parsed.currentAge = Math.max(0, Math.round(parsed.currentAge));
      parsed.lifeExpectancy = Math.max(parsed.currentAge, Math.round(parsed.lifeExpectancy));
      parsed.yearsToProject = Math.max(1, parsed.lifeExpectancy - parsed.currentAge + 1);
      parsed.inflationRate = Math.max(0, Math.min(1, parsed.inflationRate));
      parsed.moneyMarketGrowthRate = Math.max(0, Math.min(1, parsed.moneyMarketGrowthRate));
      parsed.houseGrowthRate = Math.max(0, Math.min(1, parsed.houseGrowthRate));
      for (const key of CURRENCY_KEYS) parsed[key] = Math.max(0, parsed[key]);
      return parsed;
    }
    function pickInputKeys(source) {
      const out = {};
      for (const key of INPUT_KEYS) out[key] = source[key];
      return out;
    }

    async function loadDefaultsDataFile() {
      // Browsers block fetch() to local file:// JSON due to CORS.
      // When opened directly from disk, rely on localStorage defaults instead.
      if (window.location.protocol === "file:") {
        return null;
      }
      try {
        const res = await fetch("./dennis-bussio-defaults.json", { cache: "no-store" });
        if (!res.ok) return null;
        const data = await res.json();
        return data && typeof data === "object" ? data : null;
      } catch (_err) {
        return null;
      }
    }
    function loadDefaultsFromStorage() {
      try {
        const raw = localStorage.getItem(DEFAULTS_STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return data && typeof data === "object" ? data : null;
      } catch (_err) {
        return null;
      }
    }
    function saveDefaultsToStorage(data) {
      try {
        localStorage.setItem(DEFAULTS_STORAGE_KEY, JSON.stringify(data));
      } catch (_err) {}
    }
    async function saveDefaultsDataFile(data, existingHandle = null) {
      const payload = JSON.stringify(data, null, 2);
      if (existingHandle) {
        try {
          const writable = await existingHandle.createWritable();
          await writable.write(payload);
          await writable.close();
          return { handle: existingHandle, mode: "file" };
        } catch (_err) {}
      }
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: "dennis-bussio-defaults.json",
            types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(payload);
          await writable.close();
          return { handle, mode: "file" };
        } catch (_err) {}
      }
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "dennis-bussio-defaults.json";
      a.click();
      URL.revokeObjectURL(url);
      return { handle: null, mode: "download" };
    }

    function runSimulation(p) {
      const rows = [];
      let checking = p.checkingBalance;
      let savings = p.savingsBalance;
      let retirement1 = p.retirement1Balance;
      let retirement2 = p.retirement2Balance;
      let moneyMarket = p.moneyMarketBalance;
      let houseValue = p.houseAssetValue;
      const baseAnnualSpendTotal = Math.max(0, p.annualSpendDennis + p.annualSupportMarc);
      const retirement1Rate = PROFILE_RATES[p.retirement1Profile] ?? PROFILE_RATES.balanced;
      const retirement2Rate = PROFILE_RATES[p.retirement2Profile] ?? PROFILE_RATES.balanced;
      const moneyMarketGrowthRate = p.moneyMarketGrowthRate;
      const houseGrowthRate = p.houseGrowthRate;

      for (let i = 0; i < p.yearsToProject; i++) {
        const year = p.currentYear + i;
        const age = p.currentAge + i;
        const inflationFactor = Math.pow(1 + p.inflationRate, i);
        const socialSecurity = p.socialSecurityAnnual * Math.pow(1 + SS_COLA_RATE, i);
        const pension = p.annualPension;
        const spendDennis = p.annualSpendDennis * inflationFactor;
        const supportMarc = p.annualSupportMarc * inflationFactor;
        const spendTotal = baseAnnualSpendTotal * inflationFactor;

        const rmdDivisor = age >= RMD_START_AGE ? (RMD_TABLE[Math.min(age, 100)] || 6.4) : null;
        const rmd1 = rmdDivisor ? Math.min(retirement1, retirement1 / rmdDivisor) : 0;
        const rmd2 = rmdDivisor ? Math.min(retirement2, retirement2 / rmdDivisor) : 0;
        retirement1 -= rmd1;
        retirement2 -= rmd2;

        const mandatoryIncome = socialSecurity + pension + rmd1 + rmd2;
        let needAfterIncome = Math.max(0, spendTotal - mandatoryIncome);
        const surplus = Math.max(0, mandatoryIncome - spendTotal);
        if (surplus > 0) checking += surplus;

        const drawChecking = Math.min(needAfterIncome, checking);
        checking -= drawChecking;
        needAfterIncome -= drawChecking;
        const drawSavings = Math.min(needAfterIncome, savings);
        savings -= drawSavings;
        needAfterIncome -= drawSavings;
        const drawMoneyMarket = Math.min(needAfterIncome, moneyMarket);
        moneyMarket -= drawMoneyMarket;
        needAfterIncome -= drawMoneyMarket;
        const drawRetirement1 = Math.min(needAfterIncome, retirement1);
        retirement1 -= drawRetirement1;
        needAfterIncome -= drawRetirement1;
        const drawRetirement2 = Math.min(needAfterIncome, retirement2);
        retirement2 -= drawRetirement2;
        needAfterIncome -= drawRetirement2;

        const shortfall = Math.max(0, needAfterIncome);
        const spendDelivered = spendTotal - shortfall;

        retirement1 *= (1 + retirement1Rate);
        retirement2 *= (1 + retirement2Rate);
        moneyMarket *= (1 + moneyMarketGrowthRate);
        houseValue *= (1 + houseGrowthRate);

        checking = Math.max(0, checking);
        savings = Math.max(0, savings);
        moneyMarket = Math.max(0, moneyMarket);
        retirement1 = Math.max(0, retirement1);
        retirement2 = Math.max(0, retirement2);

        const retirementTotal = retirement1 + retirement2;
        const total = checking + savings + moneyMarket + retirementTotal;
        const netWorth = total + houseValue;
        rows.push({
          year,
          age,
          spendDennis,
          supportMarc,
          spendTotal,
          socialSecurity,
          pension,
          rmd1,
          rmd2,
          totalRmd: rmd1 + rmd2,
          mandatoryIncome,
          needAfterIncome: Math.max(0, spendTotal - mandatoryIncome),
          drawChecking,
          drawSavings,
          drawMoneyMarket,
          drawRetirement1,
          drawRetirement2,
          shortfall,
          spendDelivered,
          checking,
          savings,
          moneyMarket,
          retirement1,
          retirement2,
          retirementTotal,
          total,
          houseValue,
          netWorth
        });
        if (total <= 0) break;
      }
      return rows;
    }

    function NumberField({ label, keyName, draftInputs, setField, isPercent = false, isCurrency = false, inputStyle = null }) {
      return (
        <div className="row">
          <label>{label}</label>
          <div className={`input-wrap ${isPercent ? "with-suffix" : ""} ${isCurrency ? "with-prefix" : ""}`}>
            <input type="text" inputMode="decimal" style={inputStyle || undefined} value={draftInputs[keyName]} onChange={(e) => setField(keyName, e.target.value)} />
            {isCurrency && <span className="input-prefix">$</span>}
            {isPercent && <span className="input-suffix">%</span>}
          </div>
        </div>
      );
    }
    function SelectField({ label, keyName, draftInputs, setField }) {
      return (
        <div className="row">
          <label>{label}</label>
          <select value={draftInputs[keyName]} onChange={(e) => setField(keyName, e.target.value)}>
            <option value="conservative">Conservative (2.5%)</option>
            <option value="balanced">Balanced (5.0%)</option>
            <option value="growth">Growth (8.0%)</option>
            <option value="hyperGrowth">Hyper Growth (10.0%)</option>
          </select>
        </div>
      );
    }

    function App() {
      const [applied, setApplied] = useState(() => ({ ...DEFAULT_INPUTS, asOfDateISO: new Date().toISOString() }));
      const [draftInputs, setDraftInputs] = useState(() => toDraftValues(DEFAULT_INPUTS));
      const [tableTab, setTableTab] = useState("projection");
      const [budgetPlanner, setBudgetPlanner] = useState(() => createDefaultBudgetPlanner());
      const [defaultsStatus, setDefaultsStatus] = useState("");
      const [defaultsFileHandle, setDefaultsFileHandle] = useState(null);

      useEffect(() => {
        let isMounted = true;
        (async () => {
          const fileDefaults = await loadDefaultsDataFile();
          const storedDefaults = loadDefaultsFromStorage();
          const fileBudgetPlanner = getBudgetPlannerFromDefaultsPayload(fileDefaults);
          const storedBudgetPlanner = getBudgetPlannerFromDefaultsPayload(storedDefaults);
          const mergedDefaults = { ...DEFAULT_INPUTS, ...(storedDefaults || {}), ...(fileDefaults || {}) };
          const normalized = toAppliedValues(toDraftValues(mergedDefaults), DEFAULT_INPUTS);
          if (!isMounted) return;
          setApplied({ ...normalized, asOfDateISO: new Date().toISOString() });
          setDraftInputs(toDraftValues(normalized));
          setBudgetPlanner(fileBudgetPlanner || storedBudgetPlanner || createDefaultBudgetPlanner());
          if (fileDefaults || storedDefaults) setDefaultsStatus("Defaults loaded.");
        })();
        return () => { isMounted = false; };
      }, []);

      const rows = useMemo(() => runSimulation(applied), [applied]);
      const first = rows[0];
      const last = rows[rows.length - 1];
      const startPortfolio = applied.checkingBalance + applied.savingsBalance + applied.retirement1Balance + applied.retirement2Balance + applied.moneyMarketBalance;
      const computedAnnualSpend = Math.max(0, num(draftInputs.annualSpendDennis, 0) + num(draftInputs.annualSupportMarc, 0));
      const budgetTotal = useMemo(
        () => budgetPlanner.categories.reduce((sum, cat) => sum + Math.max(0, num(cat.amount, 0)), 0),
        [budgetPlanner]
      );
      const shortfallRow = rows.find((r) => r.shortfall > 0 || r.total <= 0);
      const statusClass = shortfallRow ? "status-bad" : (last && last.total >= startPortfolio ? "status-ok" : "status-warn");
      const statusText = shortfallRow ? `Shortfall starts ${shortfallRow.year} (age ${shortfallRow.age})` : (last && last.total >= startPortfolio ? "On Track" : "Declining But Funded");
      const asOfDateLabel = applied.asOfDateISO ? fmtDate(new Date(applied.asOfDateISO)) : fmtDate(new Date());
      const chartW = 880;
      const chartH = 250;
      const chartPadL = 78;
      const chartPadR = 24;
      const maxPortfolio = Math.max(...rows.map((r) => r.total), 1);
      const maxNetWorth = Math.max(...rows.map((r) => r.netWorth || r.total), 1);
      const chartMax = Math.max(maxPortfolio, maxNetWorth);
      const yTicks = buildMixedYAxisTicks(chartMax);
      const yAxisMax = yTicks[yTicks.length - 1] || 25000;
      const plotW = chartW - chartPadL - chartPadR;
      const xTickCount = Math.min(8, rows.length);
      const xAxisTickIdx = rows.length === 0
        ? []
        : xTickCount <= 1
        ? [0]
        : Array.from({ length: xTickCount }, (_, i) =>
            Math.round((i * (rows.length - 1)) / (xTickCount - 1))
          ).filter((idx, i, arr) => i === 0 || idx !== arr[i - 1]);
      const declineIndex = rows.findIndex((r, idx) => idx > 0 && r.total < rows[idx - 1].total);
      const declineRow = declineIndex > 0 ? rows[declineIndex] : null;
      const portfolioPoints = rows.map((r, i) => {
        const x = chartPadL + (i / Math.max(1, rows.length - 1)) * plotW;
        const y = chartH - (r.total / yAxisMax) * chartH;
        return `${x},${y}`;
      }).join(" ");
      const netWorthPoints = rows.map((r, i) => {
        const x = chartPadL + (i / Math.max(1, rows.length - 1)) * plotW;
        const y = chartH - ((r.netWorth || r.total) / yAxisMax) * chartH;
        return `${x},${y}`;
      }).join(" ");

      function setField(key, value) {
        const nextValue = CURRENCY_KEYS.has(key) ? normalizeCurrencyInput(value) : value;
        setDraftInputs((prev) => ({ ...prev, [key]: nextValue }));
      }
      function applyProjection() {
        const nextApplied = toAppliedValues(draftInputs, applied);
        setApplied({ ...nextApplied, asOfDateISO: new Date().toISOString() });
        setDraftInputs(toDraftValues(nextApplied));
      }
      function setBudgetAmount(categoryName, rawValue) {
        const cleaned = normalizeCurrencyInput(rawValue);
        const parsed = Math.max(0, num(cleaned, 0));
        setBudgetPlanner((prev) => ({
          categories: prev.categories.map((cat) =>
            cat.name === categoryName ? { ...cat, amount: parsed } : cat
          )
        }));
      }
      function addBudgetCategory() {
        const entered = window.prompt("New budget category name");
        if (entered == null) return;
        const name = entered.trim();
        if (!name) {
          window.alert("Please enter a category name.");
          return;
        }
        const exists = budgetPlanner.categories.some((cat) => cat.name.toLowerCase() === name.toLowerCase());
        if (exists) {
          window.alert("That category already exists.");
          return;
        }
        setBudgetPlanner((prev) => ({ categories: [...prev.categories, { name, amount: 0 }] }));
      }
      function renameBudgetCategory() {
        const oldName = window.prompt("Rename which category? Enter exact current name.");
        if (oldName == null) return;
        const existing = budgetPlanner.categories.find((cat) => cat.name.toLowerCase() === oldName.trim().toLowerCase());
        if (!existing) {
          window.alert("Category not found.");
          return;
        }
        const nextNameInput = window.prompt(`Rename "${existing.name}" to:`, existing.name);
        if (nextNameInput == null) return;
        const nextName = nextNameInput.trim();
        if (!nextName) {
          window.alert("Please enter a category name.");
          return;
        }
        const duplicate = budgetPlanner.categories.some((cat) => cat.name.toLowerCase() === nextName.toLowerCase() && cat.name !== existing.name);
        if (duplicate) {
          window.alert("A category with that name already exists.");
          return;
        }
        setBudgetPlanner((prev) => ({
          categories: prev.categories.map((cat) => (cat.name === existing.name ? { ...cat, name: nextName } : cat))
        }));
      }
      function deleteBudgetCategory() {
        if (budgetPlanner.categories.length <= 1) {
          window.alert("At least one budget category must remain.");
          return;
        }
        const entered = window.prompt("Delete which category? Enter exact name.");
        if (entered == null) return;
        const target = budgetPlanner.categories.find((cat) => cat.name.toLowerCase() === entered.trim().toLowerCase());
        if (!target) {
          window.alert("Category not found.");
          return;
        }
        const confirmed = window.confirm(`Delete category "${target.name}"?`);
        if (!confirmed) return;
        setBudgetPlanner((prev) => ({
          categories: prev.categories.filter((cat) => cat.name !== target.name)
        }));
      }
      async function saveDefaults() {
        const nextDefaults = toAppliedValues(draftInputs, applied);
        const payload = {
          ...pickInputKeys(nextDefaults),
          budgetPlanner: normalizeBudgetPlannerData(budgetPlanner)
        };
        saveDefaultsToStorage(payload);
        const saveResult = await saveDefaultsDataFile(payload, defaultsFileHandle);
        if (saveResult?.handle) setDefaultsFileHandle(saveResult.handle);
        setDefaultsStatus(saveResult?.mode === "file"
          ? "Defaults saved to dennis-bussio-defaults.json."
          : "Defaults saved locally and downloaded as dennis-bussio-defaults.json.");
      }

      return (
        <div className="wrap">
          <h1>Portfolio Analyzer</h1>
          <p className="sub">Social Security auto-increases <strong>2% yearly</strong>. RMDs modeled from age <strong>{RMD_START_AGE}</strong>.</p>
          <p className="sub">Date: <strong>{asOfDateLabel}</strong></p>
          <div className="grid">
            <div className="panel">
              <div className="section-title">Core Inputs</div>
              <div className="split">
                <NumberField label="Current Year" keyName="currentYear" draftInputs={draftInputs} setField={setField} />
                <NumberField label="Life Expectancy" keyName="lifeExpectancy" draftInputs={draftInputs} setField={setField} />
              </div>
              <div className="split">
                <NumberField label="Current Age" keyName="currentAge" draftInputs={draftInputs} setField={setField} />
                <NumberField label="Inflation Rate" keyName="inflationRate" draftInputs={draftInputs} setField={setField} isPercent={true} />
              </div>
              <div className="section-title" style={{ marginTop: 14 }}>Annual Spend</div>
              <NumberField label="Annual Spend: Dennis" keyName="annualSpendDennis" draftInputs={draftInputs} setField={setField} isCurrency={true} />
              <NumberField label="Annual Support: Marc" keyName="annualSupportMarc" draftInputs={draftInputs} setField={setField} isCurrency={true} />
              <div className="row">
                <label>Total Annual Spend</label>
                <div className="input-wrap with-prefix">
                  <input type="text" value={formatWithCommas(computedAnnualSpend)} readOnly />
                  <span className="input-prefix">$</span>
                </div>
              </div>
              <NumberField label="Social Security Net Income" keyName="socialSecurityAnnual" draftInputs={draftInputs} setField={setField} isCurrency={true} />
              <NumberField label="Annual Pension Net Income" keyName="annualPension" draftInputs={draftInputs} setField={setField} isCurrency={true} />

              <div className="section-title" style={{ marginTop: 14 }}>Asset Balances</div>
              <div className="split">
                <NumberField label="Checking" keyName="checkingBalance" draftInputs={draftInputs} setField={setField} isCurrency={true} />
                <NumberField label="Savings" keyName="savingsBalance" draftInputs={draftInputs} setField={setField} isCurrency={true} />
              </div>
              <div className="split">
                <NumberField label="Money Market" keyName="moneyMarketBalance" draftInputs={draftInputs} setField={setField} isCurrency={true} />
                <NumberField label="Money Market Growth" keyName="moneyMarketGrowthRate" draftInputs={draftInputs} setField={setField} isPercent={true} />
              </div>
              <div className="split">
                <NumberField label="House Asset Value" keyName="houseAssetValue" draftInputs={draftInputs} setField={setField} isCurrency={true} />
                <NumberField label="House Growth Rate" keyName="houseGrowthRate" draftInputs={draftInputs} setField={setField} isPercent={true} />
              </div>
              <div className="split retirement-pair">
                <NumberField
                  label="Retirement 1 Balance"
                  keyName="retirement1Balance"
                  draftInputs={draftInputs}
                  setField={setField}
                  isCurrency={true}
                  inputStyle={{ minWidth: "9ch" }}
                />
                <SelectField label="Retirement 1 Strategy" keyName="retirement1Profile" draftInputs={draftInputs} setField={setField} />
              </div>
              <div className="split retirement-pair">
                <NumberField
                  label="Retirement 2 Balance"
                  keyName="retirement2Balance"
                  draftInputs={draftInputs}
                  setField={setField}
                  isCurrency={true}
                  inputStyle={{ minWidth: "9ch" }}
                />
                <SelectField label="Retirement 2 Strategy" keyName="retirement2Profile" draftInputs={draftInputs} setField={setField} />
              </div>

              <div className="split" style={{ marginTop: 8 }}>
                <button className="btn" type="button" onClick={applyProjection} style={{ marginTop: 0 }}>Refresh</button>
                <button className="btn" type="button" onClick={saveDefaults} style={{ marginTop: 0, background: "#14532d", borderColor: "#1f7a45", color: "#dcfce7" }}>Save</button>
              </div>
              {defaultsStatus && <div className="note">{defaultsStatus}</div>}
            </div>

            <div>
              <div className="cards">
                <div className="card"><div className="k">Status</div><div className={`v ${statusClass}`}>{statusText}</div></div>
                <div className="card"><div className="k">Start Portfolio</div><div className="v">{fmtMoney(startPortfolio, true)}</div></div>
                <div className="card"><div className="k">Final Portfolio</div><div className="v">{fmtMoney(last ? last.total : 0, true)}</div></div>
                <div className="card"><div className="k">Final Net Worth</div><div className="v">{fmtMoney(last ? (last.netWorth || last.total) : 0, true)}</div></div>
              </div>

              <div className="chart-box">
                <div style={{ display: "flex", gap: 16, marginBottom: 6, fontSize: 12, color: "#9fb0c9" }}>
                  <span><span style={{ color: "#60a5fa", fontWeight: 700 }}>-</span> Portfolio</span>
                  <span><span style={{ color: "#f472b6", fontWeight: 700 }}>-</span> Net Worth (Portfolio + House)</span>
                </div>
                <svg width="100%" viewBox={`0 0 ${chartW} ${chartH + 62}`}>
                  <line x1={chartPadL} y1={0} x2={chartPadL} y2={chartH} stroke="#35507e" strokeWidth="1.2" />
                  <line x1={chartPadL} y1={chartH} x2={chartW - chartPadR} y2={chartH} stroke="#35507e" strokeWidth="1.2" />
                  <text
                    x="16"
                    y={chartH / 2}
                    fill="#9fb8dd"
                    fontSize="9"
                    fontWeight="700"
                    textAnchor="middle"
                    transform={`rotate(-90, 16, ${chartH / 2})`}
                  >
                    Portfolio Value ($)
                  </text>
                  {yTicks.map((tickVal) => (
                    <g key={tickVal}>
                      <line
                        x1={chartPadL}
                        y1={chartH - (tickVal / yAxisMax) * chartH}
                        x2={chartW - chartPadR}
                        y2={chartH - (tickVal / yAxisMax) * chartH}
                        stroke="#22304c"
                        strokeWidth="1"
                      />
                      <text
                        x={chartPadL - 6}
                        y={chartH - (tickVal / yAxisMax) * chartH + 3}
                        fill="#94a3b8"
                        fontSize="8"
                        textAnchor="end"
                      >
                        {fmtMoney(tickVal, true)}
                      </text>
                    </g>
                  ))}
                  <polyline points={portfolioPoints} fill="none" stroke="#60a5fa" strokeWidth="2.6" />
                  <polyline points={netWorthPoints} fill="none" stroke="#f472b6" strokeWidth="2.2" strokeDasharray="6 4" />
                  {declineRow && (() => {
                    const x = chartPadL + (declineIndex / Math.max(1, rows.length - 1)) * plotW;
                    const y = chartH - (declineRow.total / yAxisMax) * chartH;
                    const labelY = Math.min(chartH - 4, y + 16);
                    return (
                      <g>
                        <line x1={x} y1={0} x2={x} y2={chartH} stroke="#f87171" strokeDasharray="5 4" strokeWidth="1.1" />
                        <circle cx={x} cy={y} r="4" fill="#f87171" stroke="#7f1d1d" strokeWidth="1" />
                        <text x={x} y={labelY} fill="#f87171" fontSize="8" fontWeight="700" textAnchor="middle">
                          {`Decline starts: ${declineRow.year} (Age ${declineRow.age})`}
                        </text>
                      </g>
                    );
                  })()}
                  {xAxisTickIdx.map((idx) => {
                    const row = rows[idx];
                    if (!row) return null;
                    const x = chartPadL + (idx / Math.max(1, rows.length - 1)) * plotW;
                    return (
                      <text key={`x-${row.year}-${row.age}`} x={x} y={chartH + 13} fill="#9fb0c9" fontSize="8" textAnchor="middle">
                        <tspan x={x} dy="0">{row.year}</tspan>
                        <tspan x={x} dy="9">{`Age ${row.age}`}</tspan>
                      </text>
                    );
                  })}
                </svg>
              </div>

              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <button type="button" onClick={() => setTableTab("projection")} style={{ border: "1px solid #2d4d7e", background: tableTab === "projection" ? "#19345f" : "#0f1d35", color: tableTab === "projection" ? "#dbeafe" : "#94a3b8", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Projection</button>
                <button type="button" onClick={() => setTableTab("rmd")} style={{ border: "1px solid #2d4d7e", background: tableTab === "rmd" ? "#19345f" : "#0f1d35", color: tableTab === "rmd" ? "#dbeafe" : "#94a3b8", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>RMD</button>
                <button type="button" onClick={() => setTableTab("budget")} style={{ border: "1px solid #2d4d7e", background: tableTab === "budget" ? "#19345f" : "#0f1d35", color: tableTab === "budget" ? "#dbeafe" : "#94a3b8", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Budget</button>
              </div>

              {tableTab === "projection" && (
                <div className="table-box">
                  <table>
                    <thead>
                      <tr>
                        <th>Year</th><th>Age</th><th>Spend Dennis</th><th>Support Marc</th><th>Total Spend</th>
                        <th>Social Security</th><th>Pension</th><th>Total RMD</th><th>Need After Income</th>
                        <th>Total End</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((r) => (
                        <tr key={r.year}>
                          <td>{r.year}</td><td>{r.age}</td><td>{fmtMoney(r.spendDennis, true)}</td><td>{fmtMoney(r.supportMarc, true)}</td>
                          <td style={{ color: "#dbeafe", fontWeight: 700 }}>{fmtMoney(r.spendTotal, true)}</td>
                          <td>{fmtMoney(r.socialSecurity, true)}</td><td>{fmtMoney(r.pension, true)}</td>
                          <td style={r.totalRmd > 0 ? { color: "#22c55e", fontWeight: 700 } : { color: "#475569" }}>{fmtMoney(r.totalRmd, true)}</td>
                          <td>{fmtMoney(r.needAfterIncome, true)}</td>
                          <td style={{ color: r.total > 0 ? "#dbeafe" : "#f87171", fontWeight: 700 }}>{fmtMoney(r.total, true)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {tableTab === "rmd" && (
                <div className="table-box">
                  <table>
                    <thead>
                      <tr><th>Year</th><th>Age</th><th>Retirement 1 RMD</th><th>Retirement 2 RMD</th><th>Total RMD</th><th>Retirement 1 End</th><th>Retirement 2 End</th><th>Total Retirement End</th></tr>
                    </thead>
                    <tbody>
                      {rows.map((r) => (
                        <tr key={`rmd-${r.year}`}>
                          <td>{r.year}</td><td>{r.age}</td>
                          <td style={r.rmd1 > 0 ? { color: "#22c55e", fontWeight: 700 } : { color: "#475569" }}>{fmtMoney(r.rmd1, true)}</td>
                          <td style={r.rmd2 > 0 ? { color: "#22c55e", fontWeight: 700 } : { color: "#475569" }}>{fmtMoney(r.rmd2, true)}</td>
                          <td style={r.totalRmd > 0 ? { color: "#22c55e", fontWeight: 700 } : { color: "#475569" }}>{fmtMoney(r.totalRmd, true)}</td>
                          <td>{fmtMoney(r.retirement1, true)}</td><td>{fmtMoney(r.retirement2, true)}</td><td style={{ color: "#dbeafe", fontWeight: 700 }}>{fmtMoney(r.retirementTotal, true)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {tableTab === "budget" && (
                <>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div className="note" style={{ marginTop: 0, marginBottom: 0 }}>
                      Add, rename, or delete categories to match Dennis's real budget.
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button type="button" onClick={addBudgetCategory} style={{ border: "1px solid #2d4d7e", background: "#19345f", color: "#dbeafe", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Add Field</button>
                      <button type="button" onClick={renameBudgetCategory} style={{ border: "1px solid #2d4d7e", background: "#0f1d35", color: "#dbeafe", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Rename Field</button>
                      <button type="button" onClick={deleteBudgetCategory} style={{ border: "1px solid #7f1d1d", background: "#3f1313", color: "#fecaca", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Delete Field</button>
                    </div>
                  </div>
                  <div className="table-box">
                    <table>
                      <thead>
                        <tr>
                          <th style={{ textAlign: "left" }}>Category</th>
                          <th style={{ width: 220, minWidth: 220, textAlign: "right" }}>Annual Amount</th>
                        </tr>
                      </thead>
                      <tbody>
                        {budgetPlanner.categories.map((cat) => (
                          <tr key={`budget-${cat.name}`}>
                            <td style={{ textAlign: "left", fontWeight: 700 }}>{cat.name}</td>
                            <td style={{ width: 220, minWidth: 220 }}>
                              <div className="input-wrap with-prefix" style={{ width: 180, marginLeft: "auto" }}>
                                <input
                                  type="text"
                                  inputMode="decimal"
                                  value={formatWithCommas(cat.amount)}
                                  onChange={(e) => setBudgetAmount(cat.name, e.target.value)}
                                  style={{ textAlign: "right" }}
                                />
                                <span className="input-prefix">$</span>
                              </div>
                            </td>
                          </tr>
                        ))}
                        <tr>
                          <td style={{ textAlign: "left", fontWeight: 800, color: "#dbeafe", fontSize: 14 }}>Total Budget</td>
                          <td style={{ width: 220, minWidth: 220, fontWeight: 800, color: "#dbeafe", textAlign: "right", fontSize: 14 }}>{fmtMoney(budgetTotal, true)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
